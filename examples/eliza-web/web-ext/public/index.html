<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eliza — Web Extension Demo</title>
  <style>
    body { font-family: monospace; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #ccc; }
    h1 { color: #fff; }
    button { background: #333; color: #ccc; border: 1px solid #555; padding: 0.4em 1em; cursor: pointer; margin: 0.25rem; }
    button:hover { background: #444; }
    pre { background: #1a1a1a; border: 1px solid #333; padding: 1rem; overflow-x: auto; white-space: pre-wrap; }
    .note { color: #888; font-size: 0.85em; }
    a { color: #7aadff; }
  </style>
</head>
<body>
  <h1>Eliza — Web Extension Demo</h1>
  <p class="note">Phase 4.3 example. Two endpoints: one public, one operator (needs bearer token).</p>
  <p><a href="/">← Spindle dashboard</a></p>

  <h2>Public endpoint</h2>
  <p class="note">GET /agent/eliza/greet — no auth required</p>
  <button id="btn-greet">Fetch /agent/eliza/greet</button>
  <pre id="greet-result">—</pre>

  <h2>Operator endpoint</h2>
  <p class="note">GET /agent/eliza/status — bearer token required (prompted on click)</p>
  <button id="btn-status">Fetch /agent/eliza/status</button>
  <pre id="status-result">—</pre>

  <script type="module">
    document.getElementById("btn-greet").addEventListener("click", async () => {
      const el = document.getElementById("greet-result");
      try {
        const res = await fetch("/agent/eliza/greet");
        el.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) {
        el.textContent = "Error: " + e.message;
      }
    });

    document.getElementById("btn-status").addEventListener("click", async () => {
      const el = document.getElementById("status-result");
      let token = sessionStorage.getItem("spindle_token");
      if (!token) {
        token = prompt("Enter bearer token:");
        if (!token) { el.textContent = "Cancelled."; return; }
        sessionStorage.setItem("spindle_token", token);
      }
      try {
        const res = await fetch("/agent/eliza/status", {
          headers: { Authorization: "Bearer " + token },
        });
        if (res.status === 401) {
          sessionStorage.removeItem("spindle_token");
          el.textContent = "401 Unauthorized — token cleared, try again.";
          return;
        }
        el.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) {
        el.textContent = "Error: " + e.message;
      }
    });
  </script>
</body>
</html>
