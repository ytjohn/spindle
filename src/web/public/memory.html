<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spindle — Memory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav">
    <span class="brand">Spindle</span>
    <a href="/">Dashboard</a>
    <a href="/sessions.html">Sessions</a>
    <a href="/events.html">Events</a>
    <a href="/inbox.html">Inbox</a>
    <a href="/operator-inbox.html">Operator</a>
    <a href="/drafts.html">Drafts</a>
    <a href="/routes.html">Routes</a>
    <a href="/memories.html" class="active">Memories</a>
  </header>
  <main>
    <h1 id="title">Memory</h1>
    <div id="error" class="error" hidden></div>
    <div id="success" class="success" hidden></div>

    <div class="card" id="meta">Loading…</div>

    <h2>Edit</h2>
    <form id="edit-form">
      <label>
        <span class="label-text">content</span>
        <textarea id="content" required></textarea>
      </label>
      <label>
        <span class="label-text">kind</span>
        <select id="kind">
          <option value="episodic">episodic</option>
          <option value="semantic">semantic</option>
          <option value="procedural">procedural</option>
        </select>
      </label>
      <label>
        <span class="label-text">visibility</span>
        <select id="visibility">
          <option value="private">private</option>
          <option value="shared">shared</option>
          <option value="thread">thread</option>
        </select>
      </label>
      <label>
        <span class="label-text">thread_id (required when visibility=thread)</span>
        <input type="text" id="thread_id" placeholder="">
      </label>
      <label>
        <span class="label-text">metadata (JSON object, or blank)</span>
        <textarea id="metadata" placeholder='e.g. {"source":"manual"}'></textarea>
      </label>
      <button type="submit" class="primary">Save</button>
      <button type="button" id="delete-btn" class="danger" hidden>Tombstone</button>
      <button type="button" id="restore-btn" class="primary" hidden>Restore</button>
      <a href="/inbox.html">Inbox</a>
    <a href="/drafts.html">Drafts</a>
    <a href="/routes.html">Routes</a>
    <a href="/memories.html"><button type="button">Back</button></a>
    </form>

    <h2>Neighbors (Hebbian)</h2>
    <div id="neighbors" class="muted">Loading…</div>
  </main>
  <script type="module">
    import { api } from "/app/api.js";
    import { escapeHtml, formatTs, relativeTs, kindBadge, visibilityBadge, tombstonedBadge } from "/app/format.js";

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (!id) {
      document.getElementById("error").hidden = false;
      document.getElementById("error").textContent = "missing ?id= parameter";
    }

    const errBox = document.getElementById("error");
    const okBox = document.getElementById("success");
    function showError(msg) {
      errBox.textContent = msg;
      errBox.hidden = false;
      okBox.hidden = true;
    }
    function showOk(msg) {
      okBox.textContent = msg;
      okBox.hidden = false;
      errBox.hidden = true;
    }

    async function load() {
      try {
        const m = await api.get(`/spindle/memories/${encodeURIComponent(id)}`);
        document.getElementById("title").textContent = `Memory #${m.id}`;
        document.getElementById("meta").innerHTML = `
          <div>${kindBadge(m.kind)} ${visibilityBadge(m.visibility)} ${tombstonedBadge(m.tombstoned_at)}</div>
          <div><strong>Agent:</strong> <span class="mono">${escapeHtml(m.agent_id)}</span></div>
          <div><strong>Created:</strong> ${escapeHtml(formatTs(m.created_at))} (${escapeHtml(relativeTs(m.created_at))})</div>
          <div><strong>Last recalled:</strong> ${escapeHtml(formatTs(m.last_recalled_at))}</div>
          <div><strong>Recall count:</strong> <span class="mono">${m.recall_count}</span></div>
          ${m.tombstoned_at ? `<div><strong>Tombstoned:</strong> ${escapeHtml(formatTs(m.tombstoned_at))} — ${escapeHtml(m.tombstone_reason ?? "")}</div>` : ""}
        `;
        document.getElementById("content").value = m.content ?? "";
        document.getElementById("kind").value = m.kind ?? "semantic";
        document.getElementById("visibility").value = m.visibility ?? "private";
        document.getElementById("thread_id").value = m.thread_id ?? "";
        document.getElementById("metadata").value =
          m.metadata ? JSON.stringify(m.metadata, null, 2) : "";

        const delBtn = document.getElementById("delete-btn");
        const restoreBtn = document.getElementById("restore-btn");
        if (m.tombstoned_at) {
          restoreBtn.hidden = false;
          delBtn.hidden = true;
        } else {
          delBtn.hidden = false;
          restoreBtn.hidden = true;
        }

        const neighbors = document.getElementById("neighbors");
        if (!m.neighbors || m.neighbors.length === 0) {
          neighbors.innerHTML = '<p class="muted">No links.</p>';
        } else {
          neighbors.innerHTML =
            '<table><thead><tr><th>src → dst</th><th>effective</th><th>strength</th><th>last reinforced</th></tr></thead><tbody>' +
            m.neighbors
              .map(
                (n) => `
              <tr>
                <td><a href="/memory.html?id=${n.src_id}" class="mono">#${n.src_id}</a> → <a href="/memory.html?id=${n.dst_id}" class="mono">#${n.dst_id}</a></td>
                <td class="mono">${n.effective_strength.toFixed(3)}</td>
                <td class="mono">${n.strength.toFixed(3)}</td>
                <td>${escapeHtml(relativeTs(n.last_reinforced_at))}</td>
              </tr>`
              )
              .join("") +
            "</tbody></table>";
        }
      } catch (err) {
        showError(err.message);
      }
    }

    document.getElementById("edit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = document.getElementById("content").value;
      const kind = document.getElementById("kind").value;
      const visibility = document.getElementById("visibility").value;
      const thread_id = document.getElementById("thread_id").value.trim();
      const metadataRaw = document.getElementById("metadata").value.trim();
      const body = { content, kind, visibility };
      if (visibility === "thread") {
        if (!thread_id) {
          showError("visibility=thread requires thread_id");
          return;
        }
        body.thread_id = thread_id;
      } else if (thread_id) {
        body.thread_id = thread_id;
      } else {
        body.thread_id = null;
      }
      if (metadataRaw) {
        try {
          body.metadata = JSON.parse(metadataRaw);
          if (typeof body.metadata !== "object" || Array.isArray(body.metadata)) {
            throw new Error("metadata must be a JSON object");
          }
        } catch (err) {
          showError("invalid metadata JSON: " + err.message);
          return;
        }
      } else {
        body.metadata = null;
      }
      try {
        await api.patch(`/spindle/memories/${encodeURIComponent(id)}`, body);
        showOk("Saved.");
        load();
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById("delete-btn").addEventListener("click", async () => {
      if (!confirm(`Tombstone memory #${id}?`)) return;
      try {
        await api.del(`/spindle/memories/${encodeURIComponent(id)}?reason=operator:web-ui`);
        showOk("Tombstoned.");
        load();
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById("restore-btn").addEventListener("click", async () => {
      try {
        await api.post(`/spindle/memories/${encodeURIComponent(id)}/restore`);
        showOk("Restored.");
        load();
      } catch (err) {
        showError(err.message);
      }
    });

    if (id) load();
  </script>
</body>
</html>
